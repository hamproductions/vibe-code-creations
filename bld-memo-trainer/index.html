<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLD Memo Trainer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
:root {
    color-scheme: dark;
    --bg: #080908;
    --panel: #111410;
    --panel-2: #151a14;
    --ink: #f1f5ec;
    --muted: #9aa391;
    --quiet: #68715f;
    --line: #283124;
    --line-2: #394632;
    --acid: #c2ff4d;
    --lime: #8bd646;
    --red: #ff5f66;
    --blue: #7ab6ff;
    --gold: #ffd66e;
    --shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
}

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
    background: var(--bg);
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        linear-gradient(90deg, rgba(194, 255, 77, 0.035) 1px, transparent 1px),
        linear-gradient(0deg, rgba(194, 255, 77, 0.028) 1px, transparent 1px),
        radial-gradient(circle at 12% 10%, rgba(139, 214, 70, 0.16), transparent 26rem),
        radial-gradient(circle at 88% 2%, rgba(122, 182, 255, 0.12), transparent 28rem),
        var(--bg);
    background-size: 34px 34px, 34px 34px, auto, auto, auto;
    color: var(--ink);
    font-family: Inter, system-ui, sans-serif;
}

button,
input,
select {
    font: inherit;
}

button {
    border: 0;
    color: inherit;
    cursor: pointer;
}

button:disabled {
    cursor: not-allowed;
    opacity: 0.48;
}

.shell {
    width: min(1480px, calc(100vw - 28px));
    margin: 0 auto;
    padding: 22px 0 42px;
}

.topbar {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 16px;
    align-items: center;
    margin-bottom: 16px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
}

.logo {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    border: 1px solid rgba(194, 255, 77, 0.42);
    background: conic-gradient(from 45deg, #f8faf3, #ef4444, #22c55e, #facc15, #f97316, #3b82f6, #f8faf3);
    box-shadow: 0 0 36px rgba(194, 255, 77, 0.15);
    flex: 0 0 auto;
}

h1 {
    margin: 0;
    font-size: clamp(26px, 4vw, 48px);
    line-height: 0.95;
    letter-spacing: 0;
}

.subhead {
    margin: 5px 0 0;
    color: var(--muted);
    font: 600 12px/1.35 "IBM Plex Mono", monospace;
    text-transform: uppercase;
    letter-spacing: 0.06em;
}

.toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: flex-end;
}

.btn {
    min-height: 40px;
    border-radius: 8px;
    border: 1px solid var(--line-2);
    background: var(--panel-2);
    padding: 0 13px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--ink);
    font: 700 12px/1 "IBM Plex Mono", monospace;
    text-transform: uppercase;
    letter-spacing: 0.04em;
}

.btn svg {
    width: 16px;
    height: 16px;
}

.btn:hover,
.btn.active {
    border-color: rgba(194, 255, 77, 0.65);
    background: #1b2418;
}

.btn.primary {
    border-color: rgba(194, 255, 77, 0.78);
    background: var(--acid);
    color: #15220b;
}

.btn.danger {
    border-color: rgba(255, 95, 102, 0.38);
    background: rgba(255, 95, 102, 0.11);
    color: #ffd1d4;
}

.settings {
    display: none;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: rgba(17, 20, 16, 0.94);
    box-shadow: var(--shadow);
    padding: 16px;
    margin-bottom: 16px;
}

.settings.open {
    display: block;
}

.settings-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
}

.field {
    display: grid;
    gap: 7px;
}

.field.wide {
    grid-column: span 2;
}

label,
.field-title {
    color: var(--quiet);
    font: 700 11px/1.2 "IBM Plex Mono", monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
}

input,
select {
    width: 100%;
    min-height: 42px;
    border: 1px solid var(--line-2);
    border-radius: 8px;
    background: #060706;
    color: var(--ink);
    padding: 0 12px;
    outline: 0;
}

input:focus,
select:focus {
    border-color: rgba(194, 255, 77, 0.72);
    box-shadow: 0 0 0 3px rgba(194, 255, 77, 0.12);
}

.preset-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.layout {
    display: grid;
    grid-template-columns: minmax(380px, 0.92fr) minmax(420px, 1.08fr);
    gap: 16px;
    align-items: start;
}

.panel {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: rgba(17, 20, 16, 0.94);
    box-shadow: var(--shadow);
}

.panel.pad {
    padding: 16px;
}

.scramble {
    min-height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #0f130e;
    border-radius: 8px;
    background: #050605;
    color: var(--acid);
    padding: 12px;
    text-align: center;
    font: 700 clamp(14px, 1.8vw, 22px)/1.35 "IBM Plex Mono", monospace;
    letter-spacing: 0.08em;
    word-break: break-word;
}

.viewer {
    margin-top: 12px;
    display: grid;
    gap: 12px;
}

.viewer-head {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 12px;
    align-items: center;
}

.viewer-title {
    display: grid;
    gap: 5px;
    min-width: 0;
}

.viewer-title strong {
    color: var(--ink);
    font: 800 13px/1 "IBM Plex Mono", monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
}

.viewer-title span {
    color: var(--muted);
    font: 700 11px/1.3 "IBM Plex Mono", monospace;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.viewer-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: flex-end;
}

.twisty-box,
.blind-box {
    height: 390px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: radial-gradient(circle at center, #121911 0, #050605 70%);
    overflow: hidden;
}

.twisty-box twisty-player {
    display: block;
    width: 100%;
    height: 100%;
}

.blind-box {
    display: none;
    place-items: center;
    color: var(--quiet);
    font: 700 14px/1 "IBM Plex Mono", monospace;
    text-transform: uppercase;
    letter-spacing: 0.14em;
}

.blind .twisty-box {
    display: none;
}

.blind .blind-box {
    display: grid;
}

.cube-net-wrap {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #090b08;
    padding: 14px;
    overflow-x: auto;
}

.cube-net {
    display: grid;
    grid-template-columns: repeat(4, 74px);
    grid-template-rows: repeat(3, 74px);
    gap: 4px;
    justify-content: center;
    min-width: 308px;
}

.face {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 1px;
    border-radius: 5px;
    background: #171b15;
    padding: 3px;
}

.sticker {
    position: relative;
    display: grid;
    place-items: center;
    border-radius: 3px;
    color: #0b0c0a;
    font: 800 12px/1 "IBM Plex Mono", monospace;
    transition: transform 120ms ease, opacity 120ms ease, box-shadow 120ms ease;
}

.sticker.dark {
    color: #f6fff0;
}

.sticker.buffer span {
    border-bottom: 2px solid currentColor;
}

.sticker.dim {
    opacity: 0.25;
}

.sticker.hot {
    z-index: 3;
    transform: scale(1.14);
    box-shadow: 0 0 0 2px #050605, 0 0 0 4px var(--acid), 0 12px 24px rgba(0, 0, 0, 0.28);
}

.sticker.guide-buffer {
    box-shadow: inset 0 0 0 3px var(--blue);
}

.sticker.guide-target {
    z-index: 2;
    transform: scale(1.08);
    box-shadow: 0 0 0 2px #050605, 0 0 0 4px var(--gold), 0 0 24px rgba(255, 214, 110, 0.28);
}

.sticker.guide-buffer.guide-target {
    box-shadow: 0 0 0 2px #050605, 0 0 0 4px var(--blue), inset 0 0 0 3px var(--gold);
}

.memo-grid {
    display: grid;
    gap: 12px;
}

.memo-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 96px;
    gap: 8px;
    align-items: end;
}

.buffer-chip {
    justify-self: end;
    color: var(--blue);
}

.memo-input {
    height: 52px;
    font: 700 20px/1 "IBM Plex Mono", monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}

.guided-panel {
    display: none;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #090b08;
    margin-top: 14px;
    padding: 12px;
}

.guided-panel.open {
    display: grid;
    gap: 12px;
}

.guided-top {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 12px;
    align-items: center;
}

.guided-title {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    min-width: 0;
}

.guided-title strong {
    font: 800 13px/1 "IBM Plex Mono", monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
}

.phase-pill {
    border: 1px solid var(--line-2);
    border-radius: 999px;
    background: #151a14;
    padding: 5px 8px;
    color: var(--blue);
    font: 800 11px/1 "IBM Plex Mono", monospace;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.guided-body {
    display: grid;
    grid-template-columns: 134px minmax(0, 1fr);
    gap: 12px;
    align-items: start;
}

.guided-buffer {
    display: grid;
    align-content: center;
    gap: 8px;
    border-radius: 8px;
    border: 1px solid rgba(122, 182, 255, 0.38);
    background: rgba(122, 182, 255, 0.09);
    min-height: 104px;
    padding: 12px;
    color: var(--blue);
}

.guided-card-label {
    color: var(--quiet);
    font: 800 11px/1 "IBM Plex Mono", monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
}

.guided-card-value {
    font: 800 40px/1 "IBM Plex Mono", monospace;
}

.guided-card-meta {
    color: var(--muted);
    font: 700 11px/1.3 "IBM Plex Mono", monospace;
    text-transform: uppercase;
    letter-spacing: 0.04em;
}

.guided-main {
    display: grid;
    gap: 10px;
    min-width: 0;
}

.guided-step-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(180px, 0.8fr);
    gap: 10px;
}

.guided-card {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #0d100c;
    padding: 10px;
    display: grid;
    gap: 8px;
    align-content: start;
    min-width: 0;
}

.guided-target-value {
    color: var(--gold);
    font: 800 24px/1 "IBM Plex Mono", monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.guided-choice-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.guided-copy {
    color: var(--muted);
    font: 700 12px/1.4 "IBM Plex Mono", monospace;
    text-transform: uppercase;
    letter-spacing: 0.04em;
}

.guided-input-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 8px;
}

.guided-input {
    height: 52px;
    font: 800 24px/1 "IBM Plex Mono", monospace;
    letter-spacing: 0.12em;
    text-transform: uppercase;
}

.guided-log {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 32px;
    align-items: center;
}

.guided-log .dict-grid {
    flex: 1 0 100%;
}

.guided-feedback {
    min-height: 18px;
    color: var(--quiet);
    font: 700 12px/1.3 "IBM Plex Mono", monospace;
    text-transform: uppercase;
    letter-spacing: 0.04em;
}

.guided-feedback.bad {
    color: var(--red);
}

.guided-feedback.ok {
    color: var(--acid);
}

.score-box {
    display: none;
    border-top: 1px solid var(--line);
    margin-top: 14px;
    padding-top: 14px;
}

.score-box.open {
    display: block;
}

.status {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 44px;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 14px;
    border: 1px solid var(--line-2);
    background: #080a07;
    font-weight: 800;
}

.status.ok {
    border-color: rgba(139, 214, 70, 0.6);
    color: #dfffca;
}

.status.bad {
    border-color: rgba(255, 95, 102, 0.58);
    color: #ffd3d5;
}

.result-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

.answer-panel {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #090b08;
    padding: 12px;
    min-width: 0;
}

.answer-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 9px;
}

.answer-head h2 {
    margin: 0;
    color: var(--muted);
    font: 800 12px/1 "IBM Plex Mono", monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
}

.pair-stream,
.input-stream {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 30px;
    align-items: center;
}

.letter-chip,
.pair-chip {
    min-width: 32px;
    min-height: 30px;
    border-radius: 7px;
    border: 1px solid var(--line-2);
    background: #111510;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 8px;
    font: 800 16px/1 "IBM Plex Mono", monospace;
}

.letter-chip.bad {
    border-color: rgba(255, 95, 102, 0.7);
    background: rgba(255, 95, 102, 0.12);
    color: var(--red);
    text-decoration: line-through;
}

.letter-chip.ok {
    color: var(--ink);
    background: rgba(194, 255, 77, 0.9);
    border-color: rgba(194, 255, 77, 0.7);
}

.empty-line {
    color: var(--quiet);
    font: 700 12px/1.4 "IBM Plex Mono", monospace;
    text-transform: uppercase;
    letter-spacing: 0.04em;
}

.dict-grid {
    display: grid;
    gap: 8px;
    margin-top: 12px;
}

.dict-card {
    display: grid;
    grid-template-columns: 56px minmax(0, 1fr);
    gap: 10px;
    align-items: start;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #0d100c;
    padding: 9px;
}

.dict-pair {
    display: grid;
    place-items: center;
    min-height: 48px;
    border-radius: 7px;
    background: #181f14;
    color: var(--acid);
    font: 800 18px/1 "IBM Plex Mono", monospace;
}

.dict-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-width: 0;
}

.term-pill {
    max-width: 100%;
    border: 1px solid #313b2c;
    border-radius: 999px;
    background: #151a14;
    padding: 6px 8px;
    color: #e9f4df;
    font-size: 12px;
    line-height: 1.15;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.term-pill b {
    color: var(--acid);
    font-weight: 800;
}

.source-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    margin-left: 4px;
    border-radius: 50%;
    background: var(--quiet);
}

.source-dot.colpi {
    background: var(--lime);
}

.source-dot.wiki {
    background: var(--blue);
}

.analysis-toggle {
    margin-top: 12px;
    width: 100%;
}

.analysis {
    display: none;
    margin-top: 12px;
}

.analysis.open {
    display: block;
}

.cycle-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

.cycle-list {
    display: grid;
    gap: 7px;
}

.cycle-line {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 7px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #0d100c;
    padding: 8px;
    color: var(--muted);
    font: 700 12px/1 "IBM Plex Mono", monospace;
}

.cycle-letter {
    color: var(--ink);
}

.cycle-buffer {
    color: var(--blue);
}

.flash {
    animation: flash 180ms ease;
}

@keyframes flash {
    50% { transform: scale(0.99); }
}

@media (max-width: 980px) {
    .topbar,
    .layout,
    .result-grid,
    .cycle-grid,
    .settings-grid {
        grid-template-columns: 1fr;
    }

    .toolbar {
        justify-content: stretch;
    }

    .toolbar .btn {
        flex: 1 1 auto;
    }

    .field.wide {
        grid-column: auto;
    }

    .twisty-box,
    .blind-box {
        height: 280px;
    }
}

@media (max-width: 540px) {
    .shell {
        width: min(100vw - 18px, 1480px);
        padding-top: 12px;
    }

    .brand {
        align-items: flex-start;
    }

    .logo {
        width: 40px;
        height: 40px;
    }

    .panel.pad,
    .settings {
        padding: 10px;
    }

    .memo-row {
        grid-template-columns: 1fr;
    }

    .guided-top,
    .viewer-head,
    .guided-body,
    .guided-step-grid,
    .guided-input-row {
        grid-template-columns: 1fr;
    }

    .viewer-actions {
        justify-content: flex-start;
    }

    .guided-buffer {
        min-height: 72px;
        font-size: 30px;
    }

    .buffer-chip {
        justify-self: start;
    }

    .cube-net {
        grid-template-columns: repeat(4, 58px);
        grid-template-rows: repeat(3, 58px);
        min-width: 244px;
    }

    .sticker {
        font-size: 10px;
    }

    .dict-card {
        grid-template-columns: 46px minmax(0, 1fr);
    }
}
    </style>
</head>
<body>
    <main class="shell">
        <header class="topbar">
            <div class="brand">
                <div class="logo" aria-hidden="true"></div>
                <div>
                    <h1>BLD Memo Trainer</h1>
                    <p class="subhead"><span id="dbStats">729 pairs</span> · Speffz cycles · dictionary-backed recall</p>
                </div>
            </div>
            <div class="toolbar">
                <button class="btn" type="button" id="settingsBtn" title="Open settings"><span data-icon="settings"></span>Settings</button>
                <button class="btn" type="button" id="blindBtn" title="Hide or show cube"><span data-icon="eye-off"></span><span id="blindText">Hide cube</span></button>
                <button class="btn primary" type="button" id="newBtn" title="Generate new scramble"><span data-icon="refresh"></span>New</button>
            </div>
        </header>

        <section class="settings" id="settingsPanel" aria-label="Trainer settings">
            <div class="settings-grid">
                <div class="field">
                    <label for="edgeBuffer">Edge buffer</label>
                    <select id="edgeBuffer"></select>
                </div>
                <div class="field">
                    <label for="cornerBuffer">Corner buffer</label>
                    <select id="cornerBuffer"></select>
                </div>
                <div class="field wide">
                    <label for="schemeInput">Letter scheme</label>
                    <input id="schemeInput" maxlength="24" autocomplete="off" spellcheck="false">
                </div>
                <div class="field wide">
                    <div class="field-title">Presets</div>
                    <div class="preset-row">
                        <button class="btn" type="button" id="speffzBtn">Speffz</button>
                        <button class="btn" type="button" id="hiraganaBtn">Hiragana</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="layout" id="trainerRoot">
            <div class="panel pad" id="viewerPanel">
                <div class="scramble" id="scrambleText">Loading...</div>
                <div class="viewer">
                    <div class="viewer-head">
                        <div class="viewer-title">
                            <strong>Interactive cube viewer</strong>
                            <span id="viewerStatus">Saved alg · preview auto-plays</span>
                        </div>
                        <div class="viewer-actions">
                            <button class="btn active" type="button" id="viewerPlayBtn" title="Replay scramble preview"><span data-icon="play"></span><span id="viewerPlayText">Playing</span></button>
                            <button class="btn" type="button" id="viewerResetBtn" title="Reset scramble preview"><span data-icon="target"></span>Reset preview</button>
                        </div>
                    </div>
                    <div class="twisty-box" id="twistyBox"></div>
                    <div class="blind-box">Blindfolded</div>
                    <div class="cube-net-wrap">
                        <div class="cube-net" id="cubeNet"></div>
                    </div>
                </div>
            </div>

            <div class="panel pad">
                <div class="memo-grid">
                    <div class="memo-row">
                        <div class="field">
                            <label for="edgesMemo">Edges memo</label>
                            <input class="memo-input" id="edgesMemo" autocomplete="off" spellcheck="false" inputmode="text">
                        </div>

function buildLetterMap() {
    const map = Array(54).fill('');
    cornerStickers.forEach((piece) => piece.indices.forEach((idx, index) => { map[idx] = piece.letters[index]; }));
    edgeStickers.forEach((piece) => piece.indices.forEach((idx, index) => { map[idx] = piece.letters[index]; }));
    map[4] = 'U';
    map[13] = 'R';
    map[22] = 'F';
    map[31] = 'D';
    map[40] = 'L';
    map[49] = 'B';
    return map;
}

function cycle(arr, a, b, c, d) {
    const temp = arr[d];
    arr[d] = arr[c];
    arr[c] = arr[b];
    arr[b] = arr[a];
    arr[a] = temp;
}

function applyMove(cube, move) {
    const m = move[0];
    const turns = move.length > 1 ? move[1] === "'" ? 3 : move[1] === '2' ? 2 : 1 : 1;
    for (let t = 0; t < turns; t += 1) {
        if (m === 'U') {
            cycle(cube, 0, 2, 8, 6); cycle(cube, 1, 5, 7, 3);
            cycle(cube, 18, 36, 45, 9); cycle(cube, 19, 37, 46, 10); cycle(cube, 20, 38, 47, 11);
        } else if (m === 'D') {
            cycle(cube, 27, 29, 35, 33); cycle(cube, 28, 32, 34, 30);
            cycle(cube, 24, 15, 51, 42); cycle(cube, 25, 16, 52, 43); cycle(cube, 26, 17, 53, 44);
        } else if (m === 'R') {
            cycle(cube, 9, 11, 17, 15); cycle(cube, 10, 14, 16, 12);
            cycle(cube, 20, 2, 51, 29); cycle(cube, 23, 5, 48, 32); cycle(cube, 26, 8, 45, 35);
        } else if (m === 'L') {
            cycle(cube, 36, 38, 44, 42); cycle(cube, 37, 41, 43, 39);
            cycle(cube, 0, 18, 27, 53); cycle(cube, 3, 21, 30, 50); cycle(cube, 6, 24, 33, 47);
        } else if (m === 'F') {
            cycle(cube, 18, 20, 26, 24); cycle(cube, 19, 23, 25, 21);
            cycle(cube, 6, 9, 29, 44); cycle(cube, 7, 12, 28, 41); cycle(cube, 8, 15, 27, 38);
        } else if (m === 'B') {
            cycle(cube, 45, 47, 53, 51); cycle(cube, 46, 50, 52, 48);
            cycle(cube, 2, 36, 33, 17); cycle(cube, 1, 39, 34, 14); cycle(cube, 0, 42, 35, 11);
        }
    }
}

function generateScramble() {
    const moves = ['U', 'D', 'L', 'R', 'F', 'B'];
    const mods = ['', "'", '2'];
    const scramble = [];
    let last = -1;
    for (let i = 0; i < 20; i += 1) {
        let next;
        do {
            next = Math.floor(Math.random() * moves.length);
        } while (next === last || (i > 1 && Math.floor(next / 2) === Math.floor(last / 2) && Math.floor(next / 2) === Math.floor(moves.indexOf(scramble[i - 2][0]) / 2)));
        last = next;
        scramble.push(moves[next] + mods[Math.floor(Math.random() * mods.length)]);
    }
    return scramble.join(' ');
}

function hasSameColors(a, b) {
    const left = [...a].sort();
    const right = [...b].sort();
    return left.length === right.length && left.every((value, index) => value === right[index]);
}

function isPieceOriented(piece, cube) {
    return piece.indices.every((idx, index) => cube[idx] === piece.colors[index]);
}

function performSwap(cube, bPiece, tPiece, targetLetter, bufferLetter) {
    const targetLetterIndex = tPiece.letters.indexOf(targetLetter);
    const targetIndices = [...tPiece.indices.slice(targetLetterIndex), ...tPiece.indices.slice(0, targetLetterIndex)];
    const bufferLetterIndex = bPiece.letters.indexOf(bufferLetter);
    const bufferIndices = [...bPiece.indices.slice(bufferLetterIndex), ...bPiece.indices.slice(0, bufferLetterIndex)];
    for (let i = 0; i < bufferIndices.length; i += 1) {
        const temp = cube[targetIndices[i]];
        cube[targetIndices[i]] = cube[bufferIndices[i]];
        cube[bufferIndices[i]] = temp;
    }
}

function isCleanlySwapped(pieceA, pieceB, cube) {
    return pieceA.indices.every((idx, index) => cube[pieceB.indices[index]] === pieceA.colors[index]) && pieceA.indices.every((idx, index) => cube[idx] === pieceB.colors[index]);
}

function getStickerIndex(letter, isCorner) {
    const stickers = isCorner ? cornerStickers : edgeStickers;
    const piece = stickers.find((item) => item.letters.includes(letter));
    if (!piece) return null;
    return piece.indices[piece.letters.indexOf(letter)];
}

function parseInputToSpeffz(input) {
    const schemeChars = Array.from(state.scheme);
    const inputChars = Array.from(input.replace(/s+/g, ''));
    let parsed = '';
    for (const char of inputChars) {
        const idx = schemeChars.findIndex((candidate) => candidate === char || candidate.toUpperCase() === char.toUpperCase());
        if (idx < 0) return { error: 'Unrecognized character: ' + char };
        parsed += SPEFFZ[idx];
    }
    return { parsed };
}

function validateExecution(parsedInput, isCorner, initialCube, bufferLetter) {
    const testCube = [...initialCube];
    const stickers = isCorner ? cornerStickers : edgeStickers;
    const bPiece = stickers.find((piece) => piece.letters.includes(bufferLetter));
    const results = [];
    for (const letter of parsedInput.split('')) {
        const tPiece = stickers.find((piece) => piece.letters.includes(letter));
        if (!tPiece) {
            results.push({ char: letter, correct: false, expected: ['Invalid'] });
            continue;
        }
        const colorsAtBuffer = bPiece.indices.map((idx) => testCube[idx]);
        const pieceAtBuffer = stickers.find((piece) => hasSameColors(piece.colors, colorsAtBuffer));
        let validTargets = [];
        if (pieceAtBuffer.id === bPiece.id) {
            for (const piece of stickers) {
                if (piece.id === bPiece.id) continue;
                if (!isPieceOriented(piece, testCube)) validTargets.push(...piece.letters);
            }
            if (!validTargets.length && !isPieceOriented(bPiece, testCube)) validTargets = bPiece.letters.filter((letterName) => letterName !== bufferLetter);
        } else {
            const letterIndex = pieceAtBuffer.colors.indexOf(colorsAtBuffer[0]);
            validTargets = [pieceAtBuffer.letters[letterIndex]];
        }
        const correct = validTargets.includes(letter);
        results.push({ char: letter, correct, expected: validTargets });
        performSwap(testCube, bPiece, tPiece, letter, bufferLetter);
    }
    const unsolved = stickers.filter((piece) => !isPieceOriented(piece, testCube));
    return { results, unsolved, testCube };
}

function guidedStickers(isCorner) {
    return isCorner ? cornerStickers : edgeStickers;
}

function guidedBufferLetter(isCorner) {
    return isCorner ? state.cornerBuffer : state.edgeBuffer;
}

function guidedCube(isCorner) {
    return isCorner ? state.guided.cornerCube : state.guided.edgeCube;
}

function validGuidedTargets(cube, isCorner) {
    const stickers = guidedStickers(isCorner);
    const bufferLetter = guidedBufferLetter(isCorner);
    const bPiece = stickers.find((piece) => piece.letters.includes(bufferLetter));
    const unsolved = stickers.filter((piece) => !isPieceOriented(piece, cube));
    if (!unsolved.length) return null;
    const colorsAtBuffer = bPiece.indices.map((idx) => cube[idx]);
    const pieceAtBuffer = stickers.find((piece) => hasSameColors(piece.colors, colorsAtBuffer));
    if (!pieceAtBuffer) return null;
    if (pieceAtBuffer.id === bPiece.id) {
        const nonBuffer = unsolved.filter((piece) => piece.id !== bPiece.id);
        const targetPiece = nonBuffer[0] || bPiece;
        const validTargets = nonBuffer.length ? nonBuffer.flatMap((piece) => piece.letters) : bPiece.letters.filter((letter) => letter !== bufferLetter);
        return { mode: nonBuffer.length ? 'break' : 'twist', bPiece, targetPiece, targetPieces: nonBuffer.length ? nonBuffer : [bPiece], validTargets, unsolved };
    }
    const letterIndex = pieceAtBuffer.colors.indexOf(colorsAtBuffer[0]);
    return { mode: 'forced', bPiece, targetPiece: pieceAtBuffer, targetPieces: [pieceAtBuffer], validTargets: [pieceAtBuffer.letters[letterIndex]], unsolved };
}

function guidedPrompt() {
    if (!state.guided?.active) return null;
    const isCorner = state.guided.phase === 'corners';
    const prompt = validGuidedTargets(guidedCube(isCorner), isCorner);
    if (prompt) return { ...prompt, isCorner, phase: state.guided.phase };
    if (state.guided.phase === 'edges') {
        state.guided.phase = 'corners';
        return guidedPrompt();
    }
    state.guided.complete = true;
    return { complete: true, isCorner: true, phase: 'complete' };
}

function guidedAcceptedRaw() {
    if (!state.guided) return [];
    return [...state.guided.edgeRaw, ...state.guided.cornerRaw];
}

function guidedAcceptedDisplay() {
    return guidedAcceptedRaw().map((letter) => getCharDisplay(letter)).join('');

    els.guidedInput.value = '';
    render();
    els.guidedInput.focus();
}

function stopGuidedPractice() {
    state.guided = null;
    render();
}

function submitGuidedLetter(value = els.guidedInput.value) {
    if (!state.guided?.active || state.guided.complete) return { accepted: false, reason: 'inactive' };
    const parsed = parseInputToSpeffz(Array.from(value.trim())[0] || '');
    els.guidedInput.value = '';
    if (parsed.error || !parsed.parsed) {
        state.guided.feedback = parsed.error || 'Type one sticker letter.';
        state.guided.lastCorrect = false;
        render();
        els.guidedInput.focus();
        return { accepted: false, reason: 'invalid' };
    }
    const letter = parsed.parsed[0];
    const prompt = guidedPrompt();
    if (!prompt || prompt.complete) return { accepted: false, reason: 'complete' };
    if (!prompt.validTargets.includes(letter)) {
        state.guided.feedback = getCharDisplay(letter) + ' is not valid. Accepted now: ' + expectedText(prompt.validTargets) + '.';
        state.guided.lastCorrect = false;
        render();
        els.guidedInput.focus();
        return { accepted: false, reason: 'wrong', expected: prompt.validTargets };
    }
    const stickers = guidedStickers(prompt.isCorner);
    const tPiece = stickers.find((piece) => piece.letters.includes(letter));
    performSwap(guidedCube(prompt.isCorner), prompt.bPiece, tPiece, letter, guidedBufferLetter(prompt.isCorner));
    const raw = prompt.isCorner ? state.guided.cornerRaw : state.guided.edgeRaw;
    raw.push(letter);
    if (prompt.isCorner) {
        els.cornersMemo.value = state.guided.cornerRaw.map((item) => getCharDisplay(item)).join('');
    } else {
        els.edgesMemo.value = state.guided.edgeRaw.map((item) => getCharDisplay(item)).join('');
    }
    state.guided.feedback = 'Accepted ' + getCharDisplay(letter) + '.';
    state.guided.lastCorrect = true;
    const nextPrompt = guidedPrompt();
    if (nextPrompt?.complete) state.guided.feedback = 'Guided practice complete.';
    render();
    els.guidedInput.focus();
    return { accepted: true, letter, next: nextPrompt };
}

function generateReferenceCycles(cube, isCorner, bufferLetter) {
    const testCube = [...cube];
    const stickers = isCorner ? cornerStickers : edgeStickers;
    const bPiece = stickers.find((piece) => piece.letters.includes(bufferLetter));
    const rawLetters = [];
    let guard = 0;
    while (guard < 80) {
        guard += 1;
        const unsolved = stickers.filter((piece) => !isPieceOriented(piece, testCube));
        if (!unsolved.length) break;
        const colorsAtBuffer = bPiece.indices.map((idx) => testCube[idx]);
        const targetPiece = stickers.find((piece) => hasSameColors(piece.colors, colorsAtBuffer));
        if (!targetPiece) break;
        let targetLetter;
        let executionPiece = targetPiece;
        if (targetPiece.id === bPiece.id) {
            const breakPiece = unsolved.find((piece) => piece.id !== bPiece.id) || bPiece;
            executionPiece = breakPiece;
            targetLetter = breakPiece.id === bPiece.id ? breakPiece.letters.find((letter) => letter !== bufferLetter) : breakPiece.letters[0];
        } else {
            const letterIndex = targetPiece.colors.indexOf(colorsAtBuffer[0]);
            targetLetter = targetPiece.letters[letterIndex];
        }
        if (!targetLetter) break;
        rawLetters.push(targetLetter);
        performSwap(testCube, bPiece, executionPiece, targetLetter, bufferLetter);
    }
    const pairs = [];
    for (let i = 0; i < rawLetters.length; i += 2) pairs.push(rawLetters.slice(i, i + 2).join(''));
    return { pairs, rawLetters, testCube, solved: stickers.every((piece) => isPieceOriented(piece, testCube)) };
}

function getCharDisplay(letter) {
    const idx = SPEFFZ.indexOf(letter);
    if (idx < 0) return letter;
    return Array.from(state.scheme)[idx] || letter;
}

function displayPair(pair) {
    return pair.split('').map(getCharDisplay).join('');
}

function pieceLabel(piece) {
    return piece ? piece.letters.map(getCharDisplay).join(' / ') : 'Solved';
}

function targetPiecesLabel(prompt) {
    if (!prompt?.targetPieces?.length) return 'Solved';
    if (prompt.targetPieces.length === 1) return pieceLabel(prompt.targetPieces[0]);
    return prompt.targetPieces.length + ' pieces';
}

function guidedChoicesHtml(prompt) {
    if (!prompt || prompt.complete) return '<span class="empty-line">Complete</span>';
    if (prompt.mode === 'forced') return '<span class="empty-line">1 destination sticker</span>';
    return prompt.validTargets.map((letter) => '<span class="letter-chip">' + escapeHtml(getCharDisplay(letter)) + '</span>').join('');
}

function expectedText(letters) {
    if (!letters?.length) return '';
    const shown = letters.slice(0, 8).map(getCharDisplay).join(' ');
    return letters.length > 8 ? shown + ' +' + (letters.length - 8) : shown;
}

function rawToPairs(rawLetters) {
    const pairs = [];
    for (let i = 0; i < rawLetters.length; i += 2) pairs.push(rawLetters.slice(i, i + 2).join(''));
    return pairs;
}

function dictionaryEntries(pair, limit = 4) {
    return (db.pairs[pair]?.entries || []).slice(0, limit);
}

function sourceClass(source) {
    if (source.startsWith('CoLPI')) return 'colpi';
    if (source === 'Speedsolving Wiki') return 'wiki';
    return '';
}

function renderDictionary(pairs) {
    if (!pairs.length) return '<div class="empty-line">No pairs needed</div>';
    return pairs.map((pair) => {
        const entries = dictionaryEntries(pair, 5);
        const content = entries.length ? entries.map((entry) => {
            const sources = entry.sources.map((source) => '<span class="source-dot ' + sourceClass(source) + '" title="' + escapeHtml(source) + '"></span>').join('');
            return '<span class="term-pill">' + escapeHtml(entry.term) + sources + '</span>';
        }).join('') : '<span class="empty-line">No dictionary hit</span>';
        return '<article class="dict-card"><div class="dict-pair">' + escapeHtml(displayPair(pair)) + '</div><div class="dict-list">' + content + '</div></article>';
    }).join('');
}

function renderLetterStream(rawLetters, validation, isCorner) {
    if (!rawLetters.length) return '<span class="empty-line">Solved</span>';
    return rawLetters.map((letter, index) => {
        const result = validation?.[index];
        const cls = result ? result.correct ? 'ok' : 'bad' : '';
        return '<button type="button" class="letter-chip ' + cls + '" data-sticker="' + getStickerIndex(letter, isCorner) + '">' + escapeHtml(getCharDisplay(letter)) + '</button>';
    }).join('');
}

function renderAnswerPanel(target, label, ref, validation, isCorner) {
    const rawLetters = ref.rawLetters;
    const pairs = rawToPairs(rawLetters);
    target.innerHTML = '<div class="answer-head"><h2>' + label + '</h2><span class="empty-line">' + rawLetters.length + ' targets</span></div><div class="input-stream">' + renderLetterStream(rawLetters, validation, isCorner) + '</div><div class="dict-grid">' + renderDictionary(pairs) + '</div>';
}

function renderCycles(target, ref, bufferLetter, isCorner) {
    if (!ref.pairs.length) {
        target.innerHTML = '<div class="empty-line">Solved</div>';
        return;
    }
    target.innerHTML = ref.pairs.map((pair) => {
        const chars = pair.split('');
        const middle = chars.map((letter) => '<button type="button" class="letter-chip cycle-letter" data-sticker="' + getStickerIndex(letter, isCorner) + '">' + escapeHtml(getCharDisplay(letter)) + '</button>').join('<span>→</span>');
        const label = pair.length === 1 ? 'Parity' : '3-cycle';
        const tail = pair.length === 1 ? '' : '<span>→</span><span class="cycle-buffer">[' + escapeHtml(getCharDisplay(bufferLetter)) + ']</span>';
        return '<div class="cycle-line"><span>' + label + '</span><span class="cycle-buffer">[' + escapeHtml(getCharDisplay(bufferLetter)) + ']</span><span>→</span>' + middle + tail + '</div>';
    }).join('');
}

function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char]));
}

function populateBuffers() {
    els.edgeBuffer.innerHTML = edgeStickers.map((piece) => '<option value="' + piece.letters[0] + '">' + getCharDisplay(piece.letters[0]) + ' / Speffz ' + piece.letters[0] + '</option>').join('');
    els.cornerBuffer.innerHTML = cornerStickers.map((piece) => '<option value="' + piece.letters[0] + '">' + getCharDisplay(piece.letters[0]) + ' / Speffz ' + piece.letters[0] + '</option>').join('');
    els.edgeBuffer.value = state.edgeBuffer;
    els.cornerBuffer.value = state.cornerBuffer;
}

function renderCubeNet() {
    const cells = [null, 0, null, null, 4, 2, 1, 5, null, 3, null, null];
    const prompt = guidedPrompt();
    const guideBuffer = new Set(prompt?.bPiece?.indices || []);
    const guideTarget = new Set((prompt?.targetPieces || prompt?.targetPiece ? prompt.targetPieces || [prompt.targetPiece] : []).flatMap((piece) => piece.indices));
    els.cubeNet.innerHTML = cells.map((faceIndex) => {
        if (faceIndex === null) return '<div></div>';
        const stickers = Array.from({ length: 9 }, (_, index) => {
            const stateIndex = faceIndex * 9 + index;
            const color = state.cube[stateIndex];
            const letter = INDEX_TO_LETTER[stateIndex];
            const hot = state.highlighted === stateIndex;
            const dim = state.highlighted !== null && !hot;
            const buffer = letter === state.edgeBuffer || letter === state.cornerBuffer;
            const guideClass = (guideBuffer.has(stateIndex) ? 'guide-buffer ' : '') + (guideTarget.has(stateIndex) ? 'guide-target ' : '');
            return '<button type="button" class="sticker ' + (DARK_FACE.has(color) ? 'dark ' : '') + (buffer ? 'buffer ' : '') + guideClass + (hot ? 'hot ' : '') + (dim ? 'dim ' : '') + '" style="background:' + FACE_COLORS[color] + '" data-sticker="' + stateIndex + '"><span>' + escapeHtml(getCharDisplay(letter)) + '</span></button>';
        }).join('');
        return '<div class="face">' + stickers + '</div>';
    }).join('');
}

function renderTwisty() {
    if (renderedTwistyScramble === state.scramble && els.twistyBox.childElementCount) return;
    renderedTwistyScramble = state.scramble;
    els.twistyBox.innerHTML = '';
    stopTwistyPreview();
    const player = document.createElement('twisty-player');
    player.setAttribute('alg', state.scramble);
    player.setAttribute('puzzle', '3x3x3');
    player.setAttribute('control-panel', 'bottom-row');
    player.setAttribute('background', 'none');
    player.setAttribute('hint-facelets', 'floating');
    player.setAttribute('back-view', 'top-right');
    player.setAttribute('camera-latitude', '22');
    player.setAttribute('camera-longitude', '45');
    player.setAttribute('tempo-scale', '1.5');
    player.setAttribute('experimental-drag-input', 'auto');
    els.twistyBox.appendChild(player);
    twistyPlayer = player;
    player.addEventListener('pointerdown', stopTwistyPreview);
    player.addEventListener('wheel', stopTwistyPreview, { passive: true });
    playTwistyPreview(player);
}

function setViewerStatus(text, playing) {
    els.viewerStatus.textContent = text;
    els.viewerPlayText.textContent = playing ? 'Playing' : 'Replay';
    els.viewerPlayBtn.classList.toggle('active', playing);
}

function stopTwistyPreview() {
    if (twistyPlayer?.controller?.animationController?.pause) twistyPlayer.controller.animationController.pause();
    else if (twistyPlayer?.pause) twistyPlayer.pause();
    setViewerStatus('Saved alg · manual control', false);
}

async function playTwistyPreview(player = twistyPlayer) {
    if (!player || state.blind) return;
    await customElements.whenDefined('twisty-player');
    if (!player.isConnected) return;
    if (player.jumpToStart) player.jumpToStart();
    setViewerStatus('Saved alg · animating scramble', true);
    if (player.controller?.animationController?.play) {
        player.controller.animationController.play({ loop: true });
        return;
    }
    if (typeof player.play === 'function') player.play();
}

function resetTwistyPreview() {
    if (twistyPlayer?.controller?.animationController?.pause) twistyPlayer.controller.animationController.pause();
    else if (twistyPlayer?.pause) twistyPlayer.pause();
    if (twistyPlayer?.jumpToStart) twistyPlayer.jumpToStart();
    setViewerStatus('Saved alg · reset to start', false);
}

function restartTwistyPreview() {
    playTwistyPreview(twistyPlayer);
}

function recomputeReferences() {
    state.edgeRef = generateReferenceCycles(state.cube, false, state.edgeBuffer);
    state.cornerRef = generateReferenceCycles(state.cube, true, state.cornerBuffer);
}

function renderResult() {
    const open = state.answerOpen || state.result;
    els.scoreBox.classList.toggle('open', Boolean(open));
    if (!open) return;
    if (state.result) {
        els.statusLine.className = 'status ' + (state.result.edges && state.result.corners ? 'ok' : 'bad');
        els.statusLine.textContent = state.result.msg;
    } else {
        els.statusLine.className = 'status';
        els.statusLine.textContent = 'Answer key open';
    }
    renderAnswerPanel(els.edgeAnswer, 'Edges answer', state.edgeRef, state.edgeValidation, false);
    renderAnswerPanel(els.cornerAnswer, 'Corners answer', state.cornerRef, state.cornerValidation, true);
    renderCycles(els.edgeCycles, state.edgeRef, state.edgeBuffer, false);
    renderCycles(els.cornerCycles, state.cornerRef, state.cornerBuffer, true);
}

function renderGuided() {
    const active = Boolean(state.guided?.active);
    els.guidedPanel.classList.toggle('open', active);
    els.guidedBtn.classList.toggle('active', active);
    if (!active) return;
    const prompt = guidedPrompt();
    const edgePairs = rawToPairs(state.guided.edgeRaw);
    const cornerPairs = rawToPairs(state.guided.cornerRaw);
    const joinedPairs = [...edgePairs, ...cornerPairs];
    els.guidedLog.innerHTML = guidedAcceptedRaw().length ? guidedAcceptedRaw().map((letter) => '<span class="letter-chip ok">' + escapeHtml(getCharDisplay(letter)) + '</span>').join('') : '<span class="empty-line">No stickers entered</span>';
    els.guidedFeedback.className = 'guided-feedback ' + (state.guided.lastCorrect === false ? 'bad' : state.guided.lastCorrect === true ? 'ok' : '');
    els.guidedFeedback.textContent = state.guided.feedback;
    if (prompt?.complete) {
        els.guidedPhase.textContent = 'Complete';
        els.guidedBuffer.textContent = '✓';
        els.guidedBufferMeta.textContent = 'Done';
        els.guidedTarget.textContent = 'Solved';
        els.guidedTargetMeta.textContent = 'Edges and corners complete';
        els.guidedChoices.innerHTML = '<span class="empty-line">Score memo</span>';
        els.guidedPrompt.textContent = 'All guided targets are solved. Score memo to verify.';
        els.guidedSubmitBtn.disabled = true;
        els.guidedInput.disabled = true;
        els.guidedInput.placeholder = '';
        if (joinedPairs.length) els.guidedLog.innerHTML += '<div class="dict-grid">' + renderDictionary(joinedPairs.slice(-4)) + '</div>';
        return;
    }
    els.guidedSubmitBtn.disabled = false;
    els.guidedInput.disabled = false;
    const phaseLabel = prompt.phase === 'edges' ? 'Edges' : 'Corners';
    els.guidedPhase.textContent = phaseLabel + ' · ' + prompt.mode;
    els.guidedBuffer.textContent = getCharDisplay(guidedBufferLetter(prompt.isCorner));
    els.guidedBufferMeta.textContent = phaseLabel + ' buffer';
    els.guidedTarget.textContent = targetPiecesLabel(prompt);
    els.guidedTargetMeta.textContent = prompt.mode === 'forced' ? 'One highlighted piece' : prompt.mode === 'break' ? 'Pick a break-in' : 'Twist in buffer';
    els.guidedChoices.innerHTML = guidedChoicesHtml(prompt);
    els.guidedInput.placeholder = prompt.mode === 'break' ? 'Any highlighted sticker' : 'Destination sticker';
    els.guidedPrompt.textContent = prompt.mode === 'forced' ? 'Read the highlighted piece from the buffer and type its destination sticker.' : prompt.mode === 'break' ? 'Cycle ended. Choose one accepted break sticker.' : 'Type a non-buffer sticker on the twisted buffer piece.';
    if (joinedPairs.length) els.guidedLog.innerHTML += '<div class="dict-grid">' + renderDictionary(joinedPairs.slice(-4)) + '</div>';
}

function render() {
    els.dbStats.textContent = db.pairCount + ' pairs / ' + db.entryCount + ' images';
    els.schemeInput.value = state.scheme;
    els.edgeBufferLabel.textContent = 'Buffer [' + getCharDisplay(state.edgeBuffer) + ']';
    els.cornerBufferLabel.textContent = 'Buffer [' + getCharDisplay(state.cornerBuffer) + ']';
    els.scrambleText.textContent = state.scramble || 'Loading...';
    els.blindText.textContent = state.blind ? 'Show cube' : 'Hide cube';
    els.blindBtn.classList.toggle('active', state.blind);
    els.viewerPanel.classList.toggle('blind', state.blind);
    els.analysisPanel.classList.toggle('open', state.analysisOpen);
    els.analysisText.textContent = state.analysisOpen ? 'Hide canonical cycles' : 'Show canonical cycles';
    els.analysisBtn.querySelector('[data-icon]').dataset.icon = state.analysisOpen ? 'chevron-up' : 'chevron-down';
    setIcons();
    populateBuffers();
    renderGuided();
    renderCubeNet();
    renderTwisty();
    renderResult();
}

function resetSession() {
    els.edgesMemo.value = '';
    els.cornersMemo.value = '';
    els.guidedInput.value = '';
    state.result = null;
    state.edgeValidation = null;
    state.cornerValidation = null;
    state.answerOpen = false;
    state.analysisOpen = false;
    state.blind = false;
    state.highlighted = null;
    state.guided = null;
}

function isValidScramble(scramble) {
    return typeof scramble === 'string' && scramble.trim().split(/\s+/).every((move) => /^[UDLRFB](2|'|2')?$/.test(move));
}

function applyScramble(scramble) {
    state.scramble = scramble.trim();
    state.cube = [...SOLVED_STATE];
    state.scramble.split(' ').forEach((move) => applyMove(state.cube, move));
}

function loadInitialScramble() {
    const saved = localStorage.getItem(SCRAMBLE_STORAGE_KEY);
    const scramble = isValidScramble(saved) ? saved : generateScramble();
    applyScramble(scramble);
    localStorage.setItem(SCRAMBLE_STORAGE_KEY, state.scramble);
    resetSession();
    recomputeReferences();
    render();
}

function newScramble(options = {}) {
    applyScramble(generateScramble());
    if (options.persist !== false) localStorage.setItem(SCRAMBLE_STORAGE_KEY, state.scramble);
    resetSession();
    recomputeReferences();
    render();
}

function scoreMemo() {
    const parsedEdges = parseInputToSpeffz(els.edgesMemo.value);
    const parsedCorners = parseInputToSpeffz(els.cornersMemo.value);
    if (parsedEdges.error || parsedCorners.error) {
        state.result = { edges: false, corners: false, parity: false, msg: parsedEdges.error || parsedCorners.error };
        state.answerOpen = true;
        renderResult();
        return;
    }
    const edgeCheck = validateExecution(parsedEdges.parsed, false, state.cube, state.edgeBuffer);
    const cornerCheck = validateExecution(parsedCorners.parsed, true, state.cube, state.cornerBuffer);
    state.edgeValidation = edgeCheck.results;
    state.cornerValidation = cornerCheck.results;
    const edgesFlawless = edgeCheck.results.every((item) => item.correct) && edgeCheck.unsolved.length <= 2;
    const cornersFlawless = cornerCheck.results.every((item) => item.correct) && cornerCheck.unsolved.length <= 2;
    const result = { edges: false, corners: false, parity: false, msg: '' };
    if (!edgeCheck.unsolved.length && edgesFlawless) result.edges = true;
    if (!cornerCheck.unsolved.length && cornersFlawless) result.corners = true;
    if (edgeCheck.unsolved.length === 2 && cornerCheck.unsolved.length === 2 && edgesFlawless && cornersFlawless && isCleanlySwapped(edgeCheck.unsolved[0], edgeCheck.unsolved[1], edgeCheck.testCube) && isCleanlySwapped(cornerCheck.unsolved[0], cornerCheck.unsolved[1], cornerCheck.testCube)) {
        result.edges = true;
        result.corners = true;
        result.parity = true;
    }
    result.msg = result.edges && result.corners ? result.parity ? 'Perfect. Parity handled.' : 'Flawless execution.' : 'Mistakes detected. Compare against the answer key.';
    state.result = result;
    state.answerOpen = true;
    state.blind = false;
    render();
}

function setScheme(value) {
    state.scheme = Array.from(value).slice(0, 24).join('');
    localStorage.setItem('bld_trainer_scheme', state.scheme);
    render();
}

function bindEvents() {
    els.settingsBtn.addEventListener('click', () => els.settingsPanel.classList.toggle('open'));
    els.newBtn.addEventListener('click', newScramble);
    els.blindBtn.addEventListener('click', () => {
        state.blind = !state.blind;
        render();
        if (state.blind) stopTwistyPreview();
        else restartTwistyPreview();
    });
    els.viewerPlayBtn.addEventListener('click', restartTwistyPreview);
    els.viewerResetBtn.addEventListener('click', resetTwistyPreview);
    els.scoreBtn.addEventListener('click', scoreMemo);
    els.guidedBtn.addEventListener('click', () => {
        if (state.guided?.active) stopGuidedPractice();
        else startGuidedPractice();
    });
    els.guidedStopBtn.addEventListener('click', stopGuidedPractice);
    els.guidedSubmitBtn.addEventListener('click', () => submitGuidedLetter());
    els.guidedInput.addEventListener('input', () => {
        const chars = Array.from(els.guidedInput.value.trim());
        if (chars.length) submitGuidedLetter(chars[0]);
    });
    els.guidedInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') submitGuidedLetter();
    });
    els.answerBtn.addEventListener('click', () => {
        state.answerOpen = true;
        state.result = null;
        state.edgeValidation = null;
        state.cornerValidation = null;
        render();
    });
    els.analysisBtn.addEventListener('click', () => {
        state.analysisOpen = !state.analysisOpen;
        render();
    });
    els.speffzBtn.addEventListener('click', () => setScheme(SPEFFZ));
    els.hiraganaBtn.addEventListener('click', () => setScheme(HIRAGANA));
    els.schemeInput.addEventListener('input', () => setScheme(els.schemeInput.value));
    els.edgeBuffer.addEventListener('change', () => {
        state.edgeBuffer = els.edgeBuffer.value;
        localStorage.setItem('bld_trainer_edge_buffer', state.edgeBuffer);
        localStorage.setItem('bld_trainer_edge_buffer_user_set', '1');
        state.guided = null;
        recomputeReferences();
        render();
    });
    els.cornerBuffer.addEventListener('change', () => {
        state.cornerBuffer = els.cornerBuffer.value;
        localStorage.setItem('bld_trainer_corner_buffer', state.cornerBuffer);
        state.guided = null;
        recomputeReferences();
        render();
    });
    document.addEventListener('mouseover', (event) => {
        const sticker = event.target.closest('[data-sticker]');
        if (!sticker) return;
        state.highlighted = Number(sticker.dataset.sticker);
        renderCubeNet();
    });
    document.addEventListener('mouseout', (event) => {
        if (!event.target.closest('[data-sticker]')) return;
        state.highlighted = null;
        renderCubeNet();
    });
}

function selfTest(iterations = 120) {
    const failures = [];
    for (let i = 0; i < iterations; i += 1) {
        const cube = [...SOLVED_STATE];
        generateScramble().split(' ').forEach((move) => applyMove(cube, move));
        const edges = generateReferenceCycles(cube, false, state.edgeBuffer);
        const corners = generateReferenceCycles(cube, true, state.cornerBuffer);
        const edgeCheck = validateExecution(edges.rawLetters.join(''), false, cube, state.edgeBuffer);
        const cornerCheck = validateExecution(corners.rawLetters.join(''), true, cube, state.cornerBuffer);
        const edgeOk = edgeCheck.unsolved.length === 0 || edgeCheck.unsolved.length === 2;
        const cornerOk = cornerCheck.unsolved.length === 0 || cornerCheck.unsolved.length === 2;
        if (!edgeCheck.results.every((item) => item.correct) || !cornerCheck.results.every((item) => item.correct) || !edgeOk || !cornerOk) failures.push({ i, edges, corners, edgeCheck, cornerCheck });
    }
    return { pass: !failures.length, failures };
}

function guidedSelfTest(iterations = 60) {
    const failures = [];
    for (let i = 0; i < iterations; i += 1) {
        newScramble({ persist: false });
        startGuidedPractice();
        let changedBreaks = 0;
        let guard = 0;
        while (state.guided?.active && !state.guided.complete && guard < 80) {
            guard += 1;
            const prompt = guidedPrompt();
            if (!prompt || prompt.complete) break;
            const canonical = prompt.isCorner ? state.cornerRef.rawLetters[state.guided.cornerRaw.length] : state.edgeRef.rawLetters[state.guided.edgeRaw.length];
            let pick = canonical && prompt.validTargets.includes(canonical) ? canonical : prompt.validTargets[0];
            if (prompt.validTargets.length > 1) {
                const alternate = prompt.validTargets.find((letter) => letter !== canonical);
                if (alternate) {
                    pick = alternate;
                    changedBreaks += 1;
                }
            }
            const result = submitGuidedLetter(pick);
            if (!result.accepted) {
                failures.push({ i, stage: 'submit', prompt, result });
                break;
            }
        }
        scoreMemo();
        const ok = state.result.edges && state.result.corners && state.guided?.complete;
        if (!ok) failures.push({ i, stage: 'score', result: state.result, guided: state.guided, changedBreaks, guard });
    }
    return { pass: !failures.length, failures };
